name: Rust

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: capylang-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build, fmt, clippy and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (driven by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (lib + integration + examples + benches)
        run: cargo test --workspace --all-targets

      - name: cargo test (doctests)
        run: cargo test --workspace --doc

      - name: Reject accidental golden updates
        run: |
          if git diff --quiet -- crates/capy-lexer/tests/fixtures crates/capy-parser/tests/fixtures; then
            echo "fixtures clean"
          else
            echo "::error::golden fixtures changed after cargo test; commit the .tokens / .ast diff or fix the lexer / parser" >&2
            git diff -- crates/capy-lexer/tests/fixtures crates/capy-parser/tests/fixtures
            exit 1
          fi
