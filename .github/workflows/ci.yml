name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: capylang-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate CapyLang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: make validate
