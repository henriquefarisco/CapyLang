name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "7 4 * * 1"

permissions:
  contents: read

jobs:
  policy:
    name: Security policy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sandbox contract
        run: make security
