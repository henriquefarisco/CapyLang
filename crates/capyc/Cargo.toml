[package]
name = "capyc"
description = "Unified CLI front-end for the CapyLang toolchain (tokens / parse / compile / disasm / run)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "capyc"
path = "src/main.rs"

[dependencies]
capy-lexer = { path = "../capy-lexer" }
capy-ast = { path = "../capy-ast" }
capy-parser = { path = "../capy-parser" }
capy-bytecode = { path = "../capy-bytecode" }
capy-diagnostics = { path = "../capy-diagnostics" }
capy-emitter = { path = "../capy-emitter" }
capy-vm = { path = "../capy-vm" }
